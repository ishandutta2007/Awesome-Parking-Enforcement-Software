<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes scanPulse {
        0%, 100% { transform: translateY(0px); opacity: 0.8; }
        50% { transform: translateY(110px); opacity: 0.3; }
      }
      @keyframes floatBeam {
        0% { transform: translateX(0px); opacity: 0.3; }
        50% { transform: translateX(30px); opacity: 0.7; }
        100% { transform: translateX(0px); opacity: 0.3; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .scanner-line {
        animation: scanPulse 3.5s ease-in-out infinite;
      }
      .radar-sweep {
        transform-origin: 1040px 170px;
        animation: radarSweep 6s linear infinite;
      }
      .grid-line {
        stroke: #334155;
        stroke-opacity: 0.25;
        stroke-dasharray: 4 4;
        animation: dashMove 10s linear infinite;
      }
      .hud-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Pattern -->
  <g class="grid-line">
    <line x1="0" y1="70" x2="1200" y2="70" stroke-width="1"/>
    <line x1="0" y1="140" x2="1200" y2="140" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke-width="1"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="340" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="340" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="340" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="340" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="340" stroke-width="1"/>
  </g>

  <!-- Glowing background orbs -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1020" cy="180" r="130" fill="#818cf8" opacity="0.1" filter="url(#glow)"/>
  <circle cx="650" cy="280" r="100" fill="#c084fc" opacity="0.08" filter="url(#glow)"/>

  <!-- Left Icon & LPR Graphic -->
  <g transform="translate(60, 65)">
    <!-- Parking Sign badge -->
    <rect x="0" y="0" width="80" height="80" rx="16" fill="url(#accentGrad)" filter="url(#glow)"/>
    <text x="40" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">P</text>
    
    <!-- ANPR Plate Visual Overlay -->
    <g transform="translate(100, 10)">
      <rect x="0" y="0" width="130" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <rect x="6" y="6" width="22" height="48" rx="4" fill="#0284c7"/>
      <circle cx="17" cy="18" r="4" fill="#ffffff"/>
      <text x="17" y="44" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">USA</text>
      <!-- Plate text -->
      <text x="75" y="38" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">ALPR•99</text>
      <!-- Bounding box brackets -->
      <path d="M-6, -6 L4,-6 M-6,-6 L-6,4" stroke="#38bdf8" stroke-width="2" fill="none"/>
      <path d="M136,-6 L126,-6 M136,-6 L136,4" stroke="#38bdf8" stroke-width="2" fill="none"/>
      <path d="M-6, 66 L4,66 M-6,66 L-6,56" stroke="#38bdf8" stroke-width="2" fill="none"/>
      <path d="M136,66 L126,66 M136,66 L136,56" stroke="#38bdf8" stroke-width="2" fill="none"/>
      <!-- Laser scan line -->
      <line x1="-10" y1="0" x2="140" y2="0" stroke="#f43f5e" stroke-width="2" opacity="0.9" class="scanner-line" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Main Titles & Headings -->
  <g transform="translate(60, 195)">
    <text class="hud-text" x="0" y="0" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="3">CURATED REPOSITORY &amp; ARCHITECTURE GUIDE</text>
    <text class="hud-text" x="0" y="42" font-size="38" font-weight="900" fill="url(#accentGrad)" letter-spacing="0.5">Awesome Parking Enforcement Software</text>
    <text class="hud-text" x="0" y="75" font-size="16" font-weight="400" fill="#94a3b8">
      Smart Parking SaaS • Citation Management • LPR / ANPR • Open-Source CV &amp; GIS
    </text>
  </g>

  <!-- Right Side Interactive Radar & Telemetry Display -->
  <g transform="translate(850, 45)">
    <!-- HUD Card Container -->
    <rect x="0" y="0" width="290" height="245" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Radar concentric circles -->
    <circle cx="145" cy="120" r="85" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="145" cy="120" r="55" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="145" cy="120" r="25" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    
    <!-- Crosshairs -->
    <line x1="145" y1="30" x2="145" y2="210" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="55" y1="120" x2="235" y2="120" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    
    <!-- Rotating Sweep -->
    <g class="radar-sweep">
      <path d="M1040,170 L970,100 A85,85 0 0,1 1040,85 Z" fill="url(#glowGrad)" opacity="0.4"/>
    </g>

    <!-- Radar Target Blips -->
    <circle cx="115" cy="85" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="180" cy="140" r="3.5" fill="#f43f5e" filter="url(#glow)"/>
    <circle cx="130" cy="165" r="3" fill="#10b981" filter="url(#glow)"/>

    <!-- Telemetry status pills -->
    <rect x="15" y="15" width="90" height="22" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="27" cy="26" r="4" fill="#10b981"/>
    <text class="hud-text" x="38" y="30" font-size="10" font-weight="700" fill="#e2e8f0" letter-spacing="1">LIVE ANPR</text>

    <rect x="180" y="15" width="95" height="22" rx="6" fill="#ffffff" fill-opacity="0.06"/>
    <text class="hud-text" x="227" y="30" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">100% AUDITED</text>

    <!-- Bottom Telemetry Stats -->
    <text class="hud-text" x="25" y="228" font-size="11" font-weight="600" fill="#38bdf8">99.8% LPR ACCURACY</text>
    <text class="hud-text" x="265" y="228" font-size="11" font-weight="600" fill="#10b981" text-anchor="end">REAL-TIME SYNC</text>
  </g>
</svg>
